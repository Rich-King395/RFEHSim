# Multi-mobile scenario example. Power values at the YAML boundary use dBm.
simulation:
  duration_s: 180.0        # Total simulation time in seconds.
  dt_s: 0.001             # Time step in seconds.
  seed: 42                # Deterministic random seed.

scenario:
  receiver_id: "rfeh_0"   # RF energy harvesting receiver ID.
  frequency_hz: 2.437e9   # Carrier frequency in Hz.

  ap:
    ap_id: "ap_0"         # Access point transmitter ID.
    distance_m: 0.3       # AP-to-receiver distance in meters.
    eirp_dbm_mean: 20.0   # Mean AP EIRP in dBm.
    eirp_dbm_std: 1.0     # AP EIRP random variation in dB.

  mobile_devices:
    - device_id: "phone_1"
      app_id: "video"
      action_id: "play"
      distance_m: 0.5
      eirp_dbm_mean: 18.0
      eirp_dbm_std: 1.0
      start_offset_s: 0.0

    - device_id: "phone_2"
      app_id: "game"
      action_id: "loading"
      distance_m: 0.5
      eirp_dbm_mean: 18.0
      eirp_dbm_std: 1.0
      start_offset_s: 1.5

    - device_id: "phone_3"
      app_id: "communication"
      action_id: "send_text"
      distance_m: 0.7
      eirp_dbm_mean: 16.0
      eirp_dbm_std: 1.0
      start_offset_s: 3.0

app_traffic:
  repeat_mode: "periodic" # Repeat each device action periodically.
  period_s: 10.0          # Action repetition period in seconds.
  jitter_s: 0.2           # Seeded start-time jitter in seconds.
  start_offset_s: 0.0     # Legacy/global first-action offset in seconds.
  repeat_until_end: true

transmitter:
  default_eirp_dbm: 15.0  # Fallback EIRP in dBm.
  model: "transaction"
  mobile_eirp_dbm_mean: 15.0
  mobile_eirp_dbm_std: 1.0
  ap_eirp_dbm_mean: 20.0
  ap_eirp_dbm_std: 1.0

wifi:
  center_freq_hz: 2.437e9
  bandwidth_hz: 20e6
  chunk_payload_bytes: 1500
  mac_overhead_bytes: 64
  preamble_s: 4.0e-5
  mobile_phy_rate_mbps: 54.0
  ap_phy_rate_mbps: 54.0
  mac_ack_enabled: true
  sifs_s: 1.6e-5
  mac_ack_duration_s: 4.0e-5
  mac_ack_eirp_dbm: 10.0
  transport_ack_enabled: true
  transport_ack_ratio: 0.02
  medium_access_model: "shared_medium_serial" # independent, ap_serial, or shared_medium_serial.
  guard_time_s: 1.0e-5      # Minimum serialized event gap in seconds.

channel:
  path_loss_exponent: 1.7
  reference_distance_m: 1.0
  shadowing_db: 1.0
  ambient_power_dbm: -30.0
  small_scale:
    enabled: true
    model: "rician"
    k_factor_db: 6.0
    coherence_time_s: 0.2
    doppler_hz:
    normalize_mean: true
    per_source_independent: true
    random_phase: true

harvester:
  capacitance_f: 0.001
  initial_v_cap: 0.64
  eta_model: "constant"
  eta_constant: 0.45
  leakage_w: 1.0e-7
  max_v_cap: 0.70
  boost:
    enabled: true
    v_on: 0.70
    v_off: 0.64
    output_voltage_v: 3.3
    load_power_w: 5.0e-5
    efficiency: 0.85
    quiescent_power_on_w: 1.0e-6
    quiescent_power_off_w: 1.0e-7
