simulation:
  duration_s: 180.0
  dt_s: 0.001
  seed: 42

scenario:
  app_id: "video"
  action_id: "play"
  distance_m: 0.5
  mobile_distance_m: 0.5
  ap_distance_m: 0.3
  frequency_hz: 2.437e9

app_traffic:
  repeat_mode: "periodic"
  period_s: 5.0
  jitter_s: 0.2
  start_offset_s: 0.0
  repeat_until_end: true

transmitter:
  default_eirp_dbm: 20.0
  model: "transaction"
  mobile_eirp_dbm_mean: 20.0
  mobile_eirp_dbm_std: 1.0
  ap_eirp_dbm_mean: 20.0
  ap_eirp_dbm_std: 1.0

wifi:
  center_freq_hz: 2.437e9
  bandwidth_hz: 20e6
  chunk_payload_bytes: 1500
  mac_overhead_bytes: 64
  preamble_s: 4.0e-5
  mobile_phy_rate_mbps: 54.0
  ap_phy_rate_mbps: 54.0
  mac_ack_enabled: true
  sifs_s: 1.6e-5
  mac_ack_duration_s: 4.0e-5
  mac_ack_eirp_dbm: 10.0
  transport_ack_enabled: true
  transport_ack_ratio: 0.02

channel:
  path_loss_exponent: 1.7
  reference_distance_m: 1.0
  shadowing_db: 3.0
  ambient_power_dbm: -30.0
  small_scale:
    enabled: true
    model: "rician"
    k_factor_db: 6.0
    coherence_time_s: 0.2
    doppler_hz:
    normalize_mean: true
    per_source_independent: true
    random_phase: true


harvester:
  capacitance_f: 0.001
  initial_v_cap: 0.64
  eta_model: "constant"
  eta_constant: 0.45
  leakage_w: 1.0e-7
  max_v_cap: 0.70
  boost:
    enabled: true
    v_on: 0.70
    v_off: 0.64
    output_voltage_v: 3.3
    load_power_w: 5.0e-5
    efficiency: 0.85
    quiescent_power_on_w: 1.0e-6
    quiescent_power_off_w: 1.0e-7
