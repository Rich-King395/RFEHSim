# Generic category-level transaction templates for simulation defaults.
# These are synthetic, plausible traffic patterns for RFEH simulator experiments,
# not measurements or reverse-engineered traces from specific commercial apps.

templates:
  video:
    play:
      transactions:
        - label: metadata
          protocol: https
          start_delay_s: [0.0, 0.3]
          duration_s: [0.2, 0.8]
          ul_bytes: [800, 3000]
          dl_bytes: [5000, 30000]
        - label: media_segment
          protocol: quic
          start_delay_s: [0.3, 1.0]
          duration_s: [1.0, 3.0]
          ul_bytes: [1000, 5000]
          dl_bytes: [200000, 1500000]
        - label: heartbeat
          protocol: https
          start_delay_s: [2.0, 4.0]
          duration_s: [0.1, 0.4]
          ul_bytes: [200, 1000]
          dl_bytes: [100, 1000]
    next:
      transactions:
        - label: stop_event
          protocol: https
          start_delay_s: [0.0, 0.1]
          duration_s: [0.05, 0.2]
          ul_bytes: [300, 1500]
          dl_bytes: [100, 800]
        - label: metadata
          protocol: https
          start_delay_s: [0.1, 0.4]
          duration_s: [0.2, 0.8]
          ul_bytes: [800, 3000]
          dl_bytes: [5000, 30000]
        - label: media_segment
          protocol: quic
          start_delay_s: [0.4, 1.0]
          duration_s: [1.0, 3.0]
          ul_bytes: [1000, 5000]
          dl_bytes: [200000, 1800000]
    pause:
      transactions:
        - label: pause_event
          protocol: https
          start_delay_s: [0.0, 0.15]
          duration_s: [0.05, 0.3]
          ul_bytes: [300, 1500]
          dl_bytes: [100, 1000]
        - label: telemetry
          protocol: https
          start_delay_s: [0.1, 0.4]
          duration_s: [0.05, 0.3]
          ul_bytes: [200, 1000]
          dl_bytes: [0, 500]
    forward:
      transactions:
        - label: seek_request
          protocol: https
          start_delay_s: [0.0, 0.2]
          duration_s: [0.1, 0.4]
          ul_bytes: [500, 2500]
          dl_bytes: [500, 3000]
        - label: segment_index
          protocol: https
          start_delay_s: [0.2, 0.6]
          duration_s: [0.2, 0.8]
          ul_bytes: [500, 2000]
          dl_bytes: [10000, 80000]
        - label: media_segment
          protocol: quic
          start_delay_s: [0.5, 1.2]
          duration_s: [1.0, 3.0]
          ul_bytes: [1000, 5000]
          dl_bytes: [200000, 1500000]

